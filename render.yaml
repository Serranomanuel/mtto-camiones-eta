services:
  - type: web
    name: etalum-web
    runtime: node
    plan: free
    buildCommand: bash build.sh
    startCommand: node .next/standalone/server.js
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
